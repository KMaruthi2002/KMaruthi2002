    <text x="40" y="142" font-size="11" fill="#9fb3c8">Python</text>
    <text x="95" y="142" font-size="11" fill="#5b7a8c">PennyLane · PyTorch · Streamlit</text>
  </g>
  <rect x="345" y="126" width="197" height="22" rx="11" fill="#070a0f" stroke="#b388ff" stroke-opacity="0.7"/>
  <text x="444" y="141" font-size="11" fill="#b388ff" text-anchor="middle">pip install qml-oncology</text>
