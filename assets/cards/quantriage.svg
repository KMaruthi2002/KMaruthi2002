<svg xmlns="http://www.w3.org/2000/svg" width="560" height="158" viewBox="0 0 560 158" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace">
  <title>QuanTriage</title>
  <defs>
    <clipPath id="r"><rect width="560" height="158" rx="10"/></clipPath>
    <clipPath id="m"><rect x="0" y="122" width="333" height="36"/></clipPath>
    <linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#b388ff" stop-opacity="0"/><stop offset="0.5" stop-color="#b388ff" stop-opacity="0.9"/><stop offset="1" stop-color="#b388ff" stop-opacity="0"/></linearGradient>
    <filter id="g" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="560" height="158" rx="10" fill="#0b1118" stroke="#1b2a38"/>
  <g clip-path="url(#r)">
    <rect x="0" y="0" width="4" height="158" fill="#b388ff"/>
    <rect x="0" y="0" width="160" height="1" fill="url(#sweep)" opacity="0.9">
      <animate attributeName="x" values="-160;560" dur="4.5s" begin="2.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="157" width="160" height="1" fill="url(#sweep)" opacity="0.6">
      <animate attributeName="x" values="560;-160" dur="4.5s" begin="3.4000000000000004s" repeatCount="indefinite"/>
    </rect>
  </g>
  <path d="M530 14H546V30" fill="none" stroke="#b388ff" stroke-width="1.5" opacity="0.8"/>
  <text x="26" y="30" font-size="10" letter-spacing="3" fill="#b388ff">// 05</text>
  <text x="26" y="52" font-size="19" font-weight="700" fill="#e6f7ff" filter="url(#g)">QuanTriage</text>
  <text x="26" y="70" font-size="13" fill="#9fb3c8">Quantum ML plus medical imaging across five cancers: diagnose,</text><text x="26" y="89" font-size="13" fill="#9fb3c8">classify, localise in 3-D on brain MRI. Abstains and refers to</text><text x="26" y="108" font-size="13" fill="#9fb3c8">a doctor when it is not sure.</text>
