<svg xmlns="http://www.w3.org/2000/svg" width="560" height="158" viewBox="0 0 560 158" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace">
  <title>EIDOS</title>
  <defs>
    <clipPath id="r"><rect width="560" height="158" rx="10"/></clipPath>
    <clipPath id="m"><rect x="0" y="122" width="326" height="36"/></clipPath>
    <linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#00f0ff" stop-opacity="0"/><stop offset="0.5" stop-color="#00f0ff" stop-opacity="0.9"/><stop offset="1" stop-color="#00f0ff" stop-opacity="0"/></linearGradient>
    <filter id="g" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="560" height="158" rx="10" fill="#0b1118" stroke="#1b2a38"/>
  <g clip-path="url(#r)">
    <rect x="0" y="0" width="4" height="158" fill="#00f0ff"/>
    <rect x="0" y="0" width="160" height="1" fill="url(#sweep)" opacity="0.9">
      <animate attributeName="x" values="-160;560" dur="4.5s" begin="0.55s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="157" width="160" height="1" fill="url(#sweep)" opacity="0.6">
      <animate attributeName="x" values="560;-160" dur="4.5s" begin="1.75s" repeatCount="indefinite"/>
    </rect>
  </g>
  <path d="M530 14H546V30" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.8"/>
  <text x="26" y="30" font-size="10" letter-spacing="3" fill="#00f0ff">// 02</text>
  <text x="26" y="52" font-size="19" font-weight="700" fill="#e6f7ff" filter="url(#g)">EIDOS</text>
  <text x="26" y="70" font-size="13" fill="#9fb3c8">Show it once. Compiles one video of a task into a program with</text><text x="26" y="89" font-size="13" fill="#9fb3c8">a visual contract per step, then checks a live camera, a</text><text x="26" y="108" font-size="13" fill="#9fb3c8">screen agent or a robot arm against it.</text>
  <g clip-path="url(#m)">
    <circle cx="30" cy="138" r="4" fill="#3572A5"/>
    <text x="40" y="142" font-size="11" fill="#9fb3c8">Python</text>
    <text x="95" y="142" font-size="11" fill="#5b7a8c">Muse Spark · SAM 3.1 · Meta hackathon</text>
  </g>
  <rect x="338" y="126" width="204" height="22" rx="11" fill="#070a0f" stroke="#00f0ff" stroke-opacity="0.7"/>
  <text x="440" y="141" font-size="11" fill="#00f0ff" text-anchor="middle">video → checkable program</text>
</svg>
