name: stats

on:
  schedule:
    - cron: "5 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/build_stats.py", ".github/workflows/stats.yml"]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render the telemetry panel
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 tools/build_stats.py

      - name: Commit the panel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git commit -m "chore: refresh telemetry panel" || { echo "nothing to commit"; exit 0; }
          git pull --rebase origin main
          git push
