name: snake

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate the contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#00f0ff&color_dots=#0e1620,#0a3a4a,#0b6b80,#0aa6c0,#00f0ff
            dist/github-snake-light.svg?color_snake=#0aa6c0&color_dots=#e6f0f5,#9bd6e3,#4fb8cf,#1c93ad,#0b6b80
            dist/github-contribution-grid-snake.gif?color_snake=#00f0ff&color_dots=#0e1620,#0a3a4a,#0b6b80,#0aa6c0,#00f0ff

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
